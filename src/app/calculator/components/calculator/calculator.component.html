<div
  class="w-screen h-40 bg-gradient-to-b from-gray-800 to-gray-700 flex items-end text-right"
  style="max-width: 300px"
>
  <div class="w-full py-5 px-6 text-6xl text-white font-thin">
    @if(subResultText() !== '0') {
    <span class="text-4xl"
      >{{ subResultText() }} <span>{{ lastOperator() }}</span></span
    >
    <br />
    }
    <span> {{ resultText() }} </span>
  </div>
</div>
<div class="w-full bg-gradient-to-b from-indigo-400 to-indigo-500">
  @for (row of buttonRows; track $index) {
  <div class="flex w-full">
    @for (button of row; track $index) {
    <calculator-button
      #calculatorButton
      [isCommand]="button.isCommand"
      [isDoubleSize]="button.isDoubleSize"
      (onClick)="handleClick($event)"
      >{{ button.label }}</calculator-button
    >
    }
  </div>
  }
